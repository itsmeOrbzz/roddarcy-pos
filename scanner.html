<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RodDarcy POS - Scanner</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="manifest" href="manifest.json">
    <style>
        body { margin: 0; overflow: hidden; background-color: #0f172a; color: #f8fafc; }
        #pairing-view, #scanner-view { display: none; flex-direction: column; height: 100vh; width: 100vw; }
        .active-view { display: flex !important; }
        
        .scanner-header { padding: 1rem; text-align: center; background: rgba(15, 23, 42, 0.9); z-index: 10; }
        
        .camera-container { flex: 1; position: relative; overflow: hidden; display: flex; justify-content: center; align-items: center; background: #000; }
        #qr-reader, #barcode-reader { width: 100%; height: 100%; }
        
        .scanner-reticle {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 80%; height: 150px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            pointer-events: none; z-index: 5;
        }
        .scanner-reticle::before, .scanner-reticle::after,
        .scanner-reticle .corner {
            content: ''; position: absolute; width: 20px; height: 20px; border-color: #14b8a6; border-style: solid;
        }
        .scanner-reticle::before { top: -2px; left: -2px; border-width: 3px 0 0 3px; }
        .scanner-reticle::after { top: -2px; right: -2px; border-width: 3px 3px 0 0; }
        .scanner-reticle .bottom-left { bottom: -2px; left: -2px; border-width: 0 0 3px 3px; }
        .scanner-reticle .bottom-right { bottom: -2px; right: -2px; border-width: 0 3px 3px 0; }
        
        .scan-line { position: absolute; top: 0; left: 0; width: 100%; height: 2px; background: #14b8a6; box-shadow: 0 0 10px #14b8a6; animation: scan 2s linear infinite; }
        @keyframes scan { 0% { top: 0; } 50% { top: 100%; } 100% { top: 0; } }

        .manual-entry { padding: 1rem; background: rgba(15, 23, 42, 0.9); z-index: 10; }
        .status-bar { padding: 1rem; background: #1e293b; border-top: 1px solid #334155; text-align: center; font-size: 1.1rem; font-weight: 600; min-height: 3.5rem; display: flex; align-items: center; justify-content: center; }
        
        .scan-flash { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(20, 184, 166, 0.5); z-index: 20; opacity: 0; pointer-events: none; transition: opacity 0.2s ease-out; }
        .scan-flash.active { opacity: 1; }
        .flash-red { background: rgba(239, 68, 68, 0.5) !important; }
        
        /* Make html5-qrcode ui look decent */
        #qr-reader img, #barcode-reader img { display: none !important; }
        #qr-reader__dashboard_section_csr span, #barcode-reader__dashboard_section_csr span { color: white !important; }
    </style>
</head>
<body>
    <div id="toast-container" class="toast-container"></div>
    
    <!-- Phase 1: Pairing -->
    <div id="pairing-view" class="active-view">
        <div class="scanner-header">
            <h2 style="margin:0 0 0.5rem 0;">Scan Register QR</h2>
            <p style="margin:0; opacity:0.8;">Point your camera at the QR code on the iPad</p>
        </div>
        <div class="camera-container">
            <div id="qr-reader"></div>
        </div>
        <div class="manual-entry">
            <div class="form-group">
                <label class="form-label">Or enter code manually</label>
                <div style="display: flex; gap: 0.5rem;">
                    <input type="text" id="manual-peer-id" class="form-input" placeholder="e.g. abcd-1234">
                    <button id="btn-connect-manual" class="btn btn-primary">Connect</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Phase 2: Scanning -->
    <div id="scanner-view">
        <div class="scanner-header" style="display: flex; justify-content: space-between; align-items: center;">
            <div class="connection-status connected">Connected</div>
            <button id="btn-disconnect" class="btn btn-danger btn-sm">Disconnect</button>
        </div>
        <div class="camera-container">
            <div id="barcode-reader"></div>
            <div class="scanner-reticle" id="reticle" style="display:none;">
                <div class="corner bottom-left"></div>
                <div class="corner bottom-right"></div>
                <div class="scan-line"></div>
            </div>
            <div id="scan-flash" class="scan-flash"></div>
        </div>
        
        <div class="manual-entry">
            <div style="display: flex; gap: 0.5rem;">
                <input type="text" id="manual-barcode" class="form-input" placeholder="Type barcode...">
                <button id="btn-submit-barcode" class="btn btn-primary">Add</button>
            </div>
        </div>
        <div class="status-bar" id="scan-status">
            Ready to scan...
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    
    <script src="js/app.js"></script>
    <script src="js/peer-manager.js"></script>
    <script src="js/scanner.js"></script>
</body>
</html>

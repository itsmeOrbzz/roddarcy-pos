<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - RodDarcy POS</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Styles -->
    <link rel="stylesheet" href="css/styles.css">
    <link rel="manifest" href="manifest.json">
</head>
<body class="register-page">

    <!-- Header -->
    <header class="app-header">
        <div class="header-left">
            <h1 class="logo">RodDarcy POS</h1>
            <div id="connection-status" class="connection-status disconnected">Disconnected</div>
        </div>
        <div class="header-right">
            <button id="btn-settings" class="btn btn-icon">⚙️ Settings</button>
            <a href="index.html" class="btn btn-ghost">Home</a>
        </div>
    </header>

    <main class="main-content">
        <!-- Pairing Screen -->
        <section id="pairing-screen" class="pairing-screen">
            <div class="card card-solid">
                <h2>Pair Scanner Device</h2>
                <p>Scan this QR code with your scanner device</p>
                <div id="qr-container" class="qr-display"></div>
                <div class="pairing-code">
                    <span>Pairing Code: </span><strong id="pairing-code-text">Generating...</strong>
                </div>
            </div>
        </section>

        <!-- Register Layout -->
        <section id="register-layout" class="register-layout hidden" style="display: none;">
            <!-- Left Panel -->
            <div class="register-main card card-solid">
                <div class="register-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                    <h2>Current Sale</h2>
                    <button id="btn-clear-cart" class="btn btn-ghost btn-sm" disabled>Clear Cart</button>
                </div>
                
                <div id="cart-list" class="cart-list">
                    <!-- Empty State -->
                    <div id="cart-empty-state" class="empty-state">
                        <div class="empty-icon" style="font-size: 3rem;">🛒</div>
                        <h3>Cart is empty</h3>
                        <p>Scan a product to add it to the cart</p>
                    </div>
                    <!-- Cart Items go here -->
                </div>

                <div class="cart-summary">
                    <div class="cart-summary-row" style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">
                        <span>Items:</span>
                        <strong id="cart-item-count">0</strong>
                    </div>
                    <div class="cart-summary-row cart-total" style="display: flex; justify-content: space-between; margin-bottom: 1rem; font-size: 1.5rem;">
                        <span>Total:</span>
                        <strong id="cart-total-value" class="cart-total-value">₱0.00</strong>
                    </div>
                    <button id="btn-complete-sale" class="btn btn-primary btn-lg btn-block" disabled>Complete Sale</button>
                </div>
            </div>

            <!-- Right Panel -->
            <div class="register-sidebar">
                <div class="receipt-panel">
                    <div id="receipt-content" class="receipt-inner">
                        <!-- Receipt content generated here -->
                    </div>
                </div>
                <div class="receipt-actions" style="display: flex; gap: 0.5rem; margin-top: 1rem;">
                    <button id="btn-share-receipt" class="btn btn-secondary">📤 Share</button>
                    <button id="btn-save-receipt" class="btn btn-secondary">💾 Save</button>
                    <button id="btn-print-receipt" class="btn btn-secondary">🖨️ Print</button>
                </div>
            </div>
        </section>
    </main>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal-overlay hidden" style="display: none;">
        <div class="modal card card-solid">
            <h2>Store Settings</h2>
            <div class="form-group">
                <label class="form-label" for="store-name">Store Name</label>
                <input class="form-input" type="text" id="store-name">
            </div>
            <div class="form-group">
                <label class="form-label" for="store-address">Store Address</label>
                <input class="form-input" type="text" id="store-address">
            </div>
            <div class="form-group">
                <label class="form-label" for="store-phone">Store Phone</label>
                <input class="form-input" type="text" id="store-phone">
            </div>
            <div class="modal-actions" style="display: flex; justify-content: flex-end; gap: 1rem; margin-top: 1rem;">
                <button id="btn-cancel-settings" class="btn btn-ghost">Cancel</button>
                <button id="btn-save-settings" class="btn btn-primary">Save Settings</button>
            </div>
        </div>
    </div>

    <!-- Complete Sale Modal -->
    <div id="complete-modal" class="modal-overlay hidden" style="display: none;">
        <div class="modal card card-solid" style="text-align: center;">
            <h2>Sale Complete!</h2>
            <div class="success-icon" style="font-size: 4rem; margin: 1rem 0;">✅</div>
            <p>Transaction saved successfully.</p>
        </div>
    </div>

    <div id="toast-container" class="toast-container"></div>

    <!-- CDNs -->
    <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    
    <!-- Local JS -->
    <script src="js/app.js"></script>
    <script src="js/db.js"></script>
    <script src="js/peer-manager.js"></script>
    <script src="js/register.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scanner - RodDarcy POS</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Styles -->
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="manifest" href="../manifest.json">
</head>
<body class="scanner-page">

    <!-- Connection Header -->
    <div class="scanner-header">
        <div id="connection-status" class="connection-status disconnected">
            Disconnected
        </div>
        <button id="btn-disconnect" class="btn btn-sm btn-ghost hidden">Disconnect</button>
    </div>

    <!-- Phase 1: Pairing Mode -->
    <section id="pairing-phase" class="scanner-phase">
        <div class="pairing-container">
            <h2>Scan Register QR Code</h2>
            <p class="subtitle">Point your camera at the QR code displayed on the iPad</p>
            
            <div class="scanner-viewfinder-wrapper">
                <div id="qr-reader"></div>
            </div>

            <div class="manual-connect">
                <p>Or enter pairing code manually:</p>
                <div class="manual-input-group">
                    <input type="text" id="manual-code-input" class="form-input" placeholder="e.g. pos-12345" autocomplete="off">
                    <button id="btn-manual-connect" class="btn btn-primary">Connect</button>
                </div>
            </div>
        </div>
    </section>

    <!-- Phase 2: Barcode Scanning Mode -->
    <section id="scanning-phase" class="scanner-phase hidden">
        <div class="barcode-scanner-container">
            <div id="barcode-reader" class="full-viewfinder"></div>
            
            <!-- Reticle Overlay -->
            <div class="scanner-reticle">
                <div class="reticle-corner top-left"></div>
                <div class="reticle-corner top-right"></div>
                <div class="reticle-corner bottom-left"></div>
                <div class="reticle-corner bottom-right"></div>
                <div class="scan-line"></div>
            </div>

            <!-- Flash Animation Overlay -->
            <div id="scan-flash" class="scan-flash"></div>
        </div>

        <!-- Status & Manual Fallback Footer -->
        <div class="scanner-footer">
            <div id="last-scanned-status" class="status-banner">
                Ready to scan...
            </div>
            
            <div class="manual-barcode-toggle">
                <button id="btn-toggle-manual" class="btn btn-secondary btn-sm">Enter Barcode Manually</button>
            </div>
        </div>
    </section>

    <!-- Manual Barcode Modal -->
    <div id="manual-barcode-modal" class="modal-overlay hidden">
        <div class="modal card card-solid">
            <h3>Manual Barcode Entry</h3>
            <div class="form-group">
                <input type="text" id="manual-barcode-input" class="form-input" placeholder="Type barcode numbers..." inputmode="numeric">
            </div>
            <div class="modal-actions">
                <button id="btn-close-manual-modal" class="btn btn-ghost">Cancel</button>
                <button id="btn-send-manual-barcode" class="btn btn-primary">Send</button>
            </div>
        </div>
    </div>

    <div id="toast-container" class="toast-container"></div>

    <!-- CDNs -->
    <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>

    <!-- Local JS -->
    <script src="../js/app.js"></script>
    <script src="../js/peer-manager.js"></script>
    <script src="../js/scanner.js"></script>
</body>
</html>

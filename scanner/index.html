<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scanner - RodDarcy POS</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Styles -->
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="manifest" href="../manifest.json">
</head>
<body class="scanner-page">

    <!-- Connection Header -->
    <div class="scanner-header">
        <div id="connection-status" class="connection-status disconnected">
            Disconnected
        </div>
        <button id="btn-disconnect" class="btn btn-sm btn-ghost hidden">Disconnect</button>
    </div>

    <!-- Phase 1: Pairing Mode -->
    <section id="pairing-phase" class="scanner-phase">
        <div class="pairing-container">
            <h2>Scan Register QR Code</h2>
            <p class="subtitle">Point your camera at the QR code displayed on the iPad</p>
            
            <div class="scanner-viewfinder-wrapper">
                <div id="qr-reader"></div>
            </div>

            <div class="manual-connect">
                <p>Or enter pairing code manually:</p>
                <div class="manual-input-group">
                    <input type="text" id="manual-code-input" class="form-input" placeholder="e.g. REG-12345" autocomplete="off">
                    <button id="btn-manual-connect" class="btn btn-primary">Connect</button>
                </div>
            </div>
        </div>
    </section>

    <!-- Phase 2: Barcode Scanning Mode -->
    <section id="scanning-phase" class="scanner-phase hidden">
        <div class="barcode-scanner-container">
            <div id="barcode-reader" class="full-viewfinder"></div>
            
            <!-- Reticle Overlay -->
            <div class="scanner-reticle">
                <div class="reticle-corner top-left"></div>
                <div class="reticle-corner top-right"></div>
                <div class="reticle-corner bottom-left"></div>
                <div class="reticle-corner bottom-right"></div>
                <div class="scan-line"></div>
            </div>

            <!-- Flash Animation Overlay -->
            <div id="scan-flash" class="scan-flash"></div>
        </div>

        <!-- Status & Manual Fallback Footer -->
        <div class="scanner-footer">
            <div id="last-scanned-status" class="status-banner">
                Ready to scan...
            </div>
            
            <div class="manual-barcode-toggle">
                <button id="btn-toggle-manual" class="btn btn-secondary btn-sm">Enter Barcode Manually</button>
            </div>
        </div>
    </section>

    <!-- Manual Barcode Modal -->
    <div id="manual-barcode-modal" class="modal-overlay hidden" style="display: none;">
        <div class="modal card card-solid">
            <h3>Manual Barcode Entry</h3>
            <div class="form-group" style="margin-top: 1rem;">
                <input type="text" id="manual-barcode-input" class="form-input" placeholder="Type barcode numbers..." inputmode="numeric">
            </div>
            <div class="modal-actions" style="margin-top: 1.5rem; display: flex; justify-content: flex-end; gap: 0.5rem;">
                <button id="btn-close-manual-modal" class="btn btn-ghost">Cancel</button>
                <button id="btn-send-manual-barcode" class="btn btn-primary">Send</button>
            </div>
        </div>
    </div>

    <!-- Phone Add New Product Modal -->
    <div id="phone-add-product-modal" class="modal-overlay hidden" style="display: none; z-index: 150;">
        <div class="modal card card-solid" style="max-width: 360px; width: 90%; margin: auto;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                <h3 style="font-size: 1.2rem; font-weight: 700; margin: 0;">📦 Add New Product</h3>
                <button id="btn-close-phone-add-modal" class="btn btn-ghost btn-sm">✕</button>
            </div>
            <p style="font-size: 0.85rem; color: var(--color-text-secondary); margin-bottom: 1rem;">
                Barcode: <strong id="phone-scanned-barcode-display" style="font-family: var(--font-mono); color: var(--color-primary);"></strong>
            </p>
            <form id="phone-add-product-form">
                <div class="form-group" style="margin-bottom: 0.75rem;">
                    <label class="form-label" style="display: block; margin-bottom: 0.25rem;">Product Name</label>
                    <input type="text" id="phone-product-name" class="form-input" placeholder="e.g. Piattos Cheese 40g" required>
                </div>
                <div class="form-group" style="margin-bottom: 0.75rem;">
                    <label class="form-label" style="display: block; margin-bottom: 0.25rem;">Selling Price (₱)</label>
                    <input type="number" id="phone-product-price" class="form-input" step="0.25" min="0" placeholder="e.g. 18.00" required>
                </div>
                <div class="form-group" style="margin-bottom: 1.25rem;">
                    <label class="form-label" style="display: block; margin-bottom: 0.25rem;">Category</label>
                    <select id="phone-product-category" class="form-select" required>
                        <!-- Populated dynamically -->
                    </select>
                </div>
                <div style="display: flex; gap: 0.5rem; justify-content: flex-end;">
                    <button type="button" id="btn-cancel-phone-add" class="btn btn-ghost">Cancel</button>
                    <button type="submit" class="btn btn-primary" style="flex: 1;">Save to Inventory</button>
                </div>
            </form>
        </div>
    </div>

    <div id="toast-container" class="toast-container"></div>

    <!-- CDNs -->
    <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>

    <!-- Local JS -->
    <script src="../js/app.js"></script>
    <script src="../js/db.js"></script>
    <script src="../js/peer-manager.js"></script>
    <script src="../js/scanner.js"></script>
</body>
</html>
